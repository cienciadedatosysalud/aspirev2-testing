server {
    listen 3000 default_server;
    listen [::]:3000 default_server;
 
    server_name _;
 
    # Permite la subida de archivos de hasta 4 GB
    client_max_body_size 4G;
 
    # Timeouts generales para peticiones y subidas grandes (30 minutos)
    client_body_timeout 1800s;
    client_header_timeout 1800s;
    keepalive_timeout 1800s;
    send_timeout 1800s;
 
    # Carpeta raíz donde se encuentra el build del frontend (UI)
    root /var/www/html;
    index index.html index.htm;
 
    # Configuración para el Frontend (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }
 
    # Redirección de la API hacia tu servicio en el puerto 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000; # Apunta a tu API corriendo localmente
        proxy_http_version 1.1;
 
        # Cabeceras estándar para mantener la información original de la petición
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
 
        # Desactiva el buffering de la petición para transmitir los 4 GB en tiempo real a la API
        proxy_request_buffering off;
 
        # Ajustes de tiempo de espera ampliados a 30 minutos para procesar ficheros de 4 GB
        proxy_connect_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
